<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Love</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 45%, #2b1055, #0f0c29 60%, #000);
    overflow: hidden;
  }

  .scene {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 320px;
    height: 320px;
  }

  .heart {
    position: relative;
    width: 100px;
    height: 100px;
    background: #ff1e56;
    transform: rotate(-45deg);
    animation: beat 1.2s ease-in-out infinite;
    filter: drop-shadow(0 0 18px rgba(255, 30, 86, .9))
            drop-shadow(0 0 55px rgba(255, 30, 86, .5));
    z-index: 2;
  }

  .heart::before,
  .heart::after {
    content: "";
    position: absolute;
    width: 100px;
    height: 100px;
    background: #ff1e56;
    border-radius: 50%;
  }

  .heart::before { top: -50px; left: 0; }
  .heart::after  { top: 0; left: 50px; }

  @keyframes beat {
    0%, 100% { transform: rotate(-45deg) scale(1); }
    15%      { transform: rotate(-45deg) scale(1.2); }
    30%      { transform: rotate(-45deg) scale(1); }
    45%      { transform: rotate(-45deg) scale(1.12); }
    60%      { transform: rotate(-45deg) scale(1); }
  }

  .glow {
    position: absolute;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 2px solid rgba(255, 30, 86, .6);
    animation: ripple 2.4s ease-out infinite;
  }

  .glow:nth-child(2) { animation-delay: .8s; }
  .glow:nth-child(3) { animation-delay: 1.6s; }

  @keyframes ripple {
    0%   { transform: scale(.6); opacity: .9; }
    100% { transform: scale(2.6); opacity: 0; }
  }

  .spark {
    position: absolute;
    border-radius: 50%;
    animation: float 3s ease-in-out infinite;
    will-change: transform, opacity;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(.6);   opacity: .15; }
    50%      { transform: translateY(-40px) scale(1.4); opacity: 1; }
  }

  .text {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    color: #fff;
    font-size: 28px;
    font-weight: bold;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    letter-spacing: 4px;
    text-shadow: 0 0 10px #ff1e56, 0 0 20px #ff1e56, 0 0 30px #ff1e56;
    pointer-events: none;
  }
</style>
</head>
<body>

  <div class="scene">
    <div class="glow"></div>
    <div class="glow"></div>
    <div class="glow"></div>
    <div class="heart"></div>
    <div class="text">志校儿</div>
  </div>

<script>
  const scene = document.querySelector('.scene');
  const COLORS = ['#ff8fab', '#ff1e56', '#ffd6e0', '#ff5c8a', '#ffb3c6'];
  const COUNT = 60;

  for (let i = 0; i < COUNT; i++) {
    const s = document.createElement('span');
    s.className = 'spark';

    const a = Math.random() * Math.PI * 2;
    const r = 70 + Math.random() * 90;
    const size = 2 + Math.random() * 5;
    const color = COLORS[Math.floor(Math.random() * COLORS.length)];

    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.background = color;
    s.style.boxShadow = `0 0 ${6 + size * 2}px ${color}`;
    s.style.left = (160 + Math.cos(a) * r) + 'px';
    s.style.top  = (160 + Math.sin(a) * r) + 'px';
    s.style.animationDelay = (Math.random() * 3) + 's';
    s.style.animationDuration = (2 + Math.random() * 2.5) + 's';

    scene.appendChild(s);
  }
</script>

</body>
</html>
